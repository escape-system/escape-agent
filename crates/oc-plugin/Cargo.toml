[package]
name = "oc-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native plugin surface and JS sidecar bridge for opencode-rust"

[dependencies]
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

# Test double for the JS sidecar bridge. It speaks the same newline-framed
# JSON-RPC protocol as a real Bun/Node host so the bridge can be tested without
# either runtime installed. Selected by `FAKE_PLUGIN_SIDECAR_MODE`.
[[bin]]
name = "oc-plugin-fake-sidecar"
path = "src/bin/fake_sidecar.rs"

[lints]
workspace = true

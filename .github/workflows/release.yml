name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist, e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install Windows cross-compiler and zip
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: Resolve and verify version
        id: v
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          VER="${TAG#v}"
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "oc-cli") | .version')
          echo "tag=$TAG cargo_version=$CARGO_VER"
          if [ "$CARGO_VER" != "$VER" ]; then
            echo "::error::Cargo.toml version ($CARGO_VER) != tag ($VER); bump [workspace.package] version first"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Build web app
        run: bash ui/build.sh
      - name: Build server binaries (Linux and Windows)
        run: |
          cargo build --release -p oc-cli --bin opencode --target x86_64-unknown-linux-gnu
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
            cargo build --release -p oc-cli --bin opencode --target x86_64-pc-windows-gnu
      - name: Verify binary reports the tag version
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.version }}"
          GOT=$(./target/x86_64-unknown-linux-gnu/release/opencode --version)
          echo "binary reports: $GOT"
          if [ "$GOT" != "opencode $VER" ]; then
            echo "::error::binary reports '$GOT', expected 'opencode $VER'"
            exit 1
          fi
      - name: Package
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.version }}"
          LINUX_NAME="opencode-${VER}-linux-x86_64"
          WIN_NAME="opencode-${VER}-windows-x86_64"

          mkdir -p "dist/$LINUX_NAME/web" "dist/$WIN_NAME/web"
          cp target/x86_64-unknown-linux-gnu/release/opencode "dist/$LINUX_NAME/opencode"
          cp target/x86_64-pc-windows-gnu/release/opencode.exe "dist/$WIN_NAME/opencode.exe"
          for NAME in "$LINUX_NAME" "$WIN_NAME"; do
            cp -a web/dist "dist/$NAME/web/dist"
            cp README.md "dist/$NAME/" 2>/dev/null || true
            if [ -f LICENSE ]; then cp LICENSE "dist/$NAME/"; fi
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          done
          ( cd dist && zip -qr "$WIN_NAME.zip" "$WIN_NAME" )
          (
            cd dist
            sha256sum "$LINUX_NAME.tar.gz" > "$LINUX_NAME.tar.gz.sha256"
            sha256sum "$WIN_NAME.tar.gz" > "$WIN_NAME.tar.gz.sha256"
            sha256sum "$WIN_NAME.zip" > "$WIN_NAME.zip.sha256"
            sha256sum "$LINUX_NAME.tar.gz" "$WIN_NAME.tar.gz" "$WIN_NAME.zip" > SHA256SUMS
          )
          ls -l dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          git fetch --tags --force origin
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "updating existing release $TAG"
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS \
              --title "$TAG" --generate-notes --verify-tag
          fi

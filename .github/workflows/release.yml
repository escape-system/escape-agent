name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist, e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve and verify version
        id: v
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          VER="${TAG#v}"
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "oc-cli") | .version')
          echo "tag=$TAG cargo_version=$CARGO_VER"
          if [ "$CARGO_VER" != "$VER" ]; then
            echo "::error::Cargo.toml version ($CARGO_VER) != tag ($VER); bump [workspace.package] version first"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Build web app
        run: bash ui/build.sh
      - name: Build server binary
        run: cargo build --release -p oc-cli --bin opencode
      - name: Verify binary reports the tag version
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.version }}"
          GOT=$(./target/release/opencode --version)
          echo "binary reports: $GOT"
          if [ "$GOT" != "opencode $VER" ]; then
            echo "::error::binary reports '$GOT', expected 'opencode $VER'"
            exit 1
          fi
      - name: Package
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.version }}"
          NAME="opencode-${VER}-linux-x86_64"
          mkdir -p "dist/$NAME/web"
          cp target/release/opencode "dist/$NAME/opencode"
          cp -a web/dist "dist/$NAME/web/dist"
          cp README.md "dist/$NAME/" 2>/dev/null || true
          if [ -f LICENSE ]; then cp LICENSE "dist/$NAME/"; fi
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          ( cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )
          ls -l dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          git fetch --tags --force origin
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "replacing existing release $TAG"
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
            --title "$TAG" --generate-notes --verify-tag

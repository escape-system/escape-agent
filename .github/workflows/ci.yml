name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # `oc-bench` drives the real server, so it needs a release `opencode`
      # binary; without this build it cannot resolve one and measures nothing.
      - name: Build release server binary for performance gates
        run: cargo build --release -p oc-cli --bin opencode
      # Blocking gate: the idle-RSS budget is met (see
      # docs/15-performance.md "Measured"), so this must fail a PR that
      # regresses it. `idle-rss` reports SKIP on non-Linux runners.
      - name: Performance gates
        run: cargo run --release -p oc-testkit --bin oc-bench -- idle-rss

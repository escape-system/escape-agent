name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          # Several modules use unix-only APIs (oc-cli service registration,
          # oc-mcp stdio transport, oc-pty shell, oc-runtime lanes, oc-server
          # shell manager), so Windows does not build yet. Keep the leg visible
          # but non-blocking until those paths are cfg-gated.
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # `oc-bench` drives the real server, so it needs a release `opencode`
      # binary; without this build it cannot resolve one and measures nothing.
      - name: Build release server binary for performance gates
        if: runner.os == 'Linux'
        run: cargo build --release -p oc-cli --bin opencode
      # Blocking gate: the idle-RSS budget is met (see docs/15-performance.md
      # "Measured"), so this must fail a PR that regresses it. `idle-rss`
      # reports SKIP on non-Linux runners.
      - name: Performance gates
        if: runner.os == 'Linux'
        run: cargo run --release -p oc-testkit --bin oc-bench -- idle-rss

  ui:
    name: ui build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Build web app
        run: bash ui/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
